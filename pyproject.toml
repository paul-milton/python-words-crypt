[tool.poetry]
name = "words-crypt"
version = "0.1.0"
description = "🐚 Encrypt/decrypt payloads into BIP39 words (ChaCha20-Poly1305 + scrypt), with optional zip container and cached wordlist download."
authors = ["Alex <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "words_crypt", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
cryptography = "^42.0.0"
click = "^8.1.0"

[tool.poetry.scripts]
words-crypt = "words_crypt.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
